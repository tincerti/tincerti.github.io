<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #globe-container { width: 100%; height: 100%; }

    #tooltip {
      position: absolute;
      background: rgba(255,255,255,0.96);
      border: 1px solid #e0e0e8;
      border-radius: 7px;
      padding: 6px 12px;
      color: #1c1c1e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s;
      white-space: normal;
      max-width: 220px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      z-index: 10;
    }
    #tooltip.visible { opacity: 1; }

    #legend {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(100,110,130,0.55);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      letter-spacing: 0.03em;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="globe-container"></div>
<div id="tooltip"></div>
<div id="legend">Drag to rotate · Scroll to zoom · Hover for institution</div>

<script src="https://unpkg.com/globe.gl@2.30.0/dist/globe.gl.min.js"></script>
<script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
<script>

const locations = [
  { name: "Columbia University",                               lat: 40.807876,  lng: -73.961843 },
  { name: "Stanford University",                               lat: 37.427839,  lng: -122.169524 },
  { name: "European University Institute",                     lat: 43.803234,  lng: 11.283335 },
  { name: "University of Tokyo",                               lat: 35.711326,  lng: 139.761965 },
  { name: "Yale University",                                   lat: 41.316494,  lng: -72.922021 },
  { name: "Harvard University",                                lat: 42.375804,  lng: -71.112731 },
  { name: "Harvard Kennedy School",                            lat: 42.371422,  lng: -71.121409 },
  { name: "Ghent University",                                  lat: 51.046813,  lng: 3.727652 },
  { name: "University of Toronto",                             lat: 43.662113,  lng: -79.392097 },
  { name: "UC Berkeley",                                       lat: 37.871570,  lng: -122.254497 },
  { name: "Copenhagen Business School",                        lat: 55.681674,  lng: 12.530435 },
  { name: "Dartmouth College",                                 lat: 43.704588,  lng: -72.288093 },
  { name: "IDinsight",                                         lat: 28.555415,  lng: 77.195274 },
  { name: "Georgetown University",                             lat: 38.907926,  lng: -77.073052 },
  { name: "University of Amsterdam",                           lat: 52.364092,  lng: 4.912617 },
  { name: "Universidad Carlos III",                            lat: 40.406895,  lng: -3.709660 },
  { name: "German Marshall Fund",                              lat: 50.838857,  lng: 4.373953 },
  { name: "Leiden University",                                 lat: 52.078664,  lng: 4.320107 },
  { name: "Waseda University",                                 lat: 35.709127,  lng: 139.720136 },
  { name: "Oxford University",                                 lat: 51.763555,  lng: -1.261799 },
  { name: "New York University",                               lat: 40.729323,  lng: -73.994833 },
  { name: "London School of Economics and Political Science",  lat: 51.515364,  lng: -0.117989 },
  { name: "University of California, Santa Barbara",           lat: 34.414149,  lng: -119.848561 }
];

// Generate a plain-colour ocean texture via canvas
function makeOceanTexture(color) {
  const c = document.createElement('canvas');
  c.width = 2; c.height = 2;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, 2, 2);
  return c.toDataURL();
}

const container = document.getElementById('globe-container');
const tooltip   = document.getElementById('tooltip');

const globe = Globe({ animateIn: true })(container)
  .backgroundColor('rgba(0,0,0,0)')
  .showAtmosphere(true)
  .atmosphereColor('#d8eaf8')
  .atmosphereAltitude(0.12)
  .globeImageUrl(makeOceanTexture('#c8dff2'))
  .showGraticules(true)
  // Dots
  .pointsData(locations)
  .pointLat('lat')
  .pointLng('lng')
  .pointAltitude(0.02)
  .pointRadius(0.45)
  .pointColor(() => '#2563eb')
  .pointResolution(16)
  .pointLabel(() => '')
  .onPointHover(point => {
    if (point) {
      tooltip.textContent = point.name;
      tooltip.classList.add('visible');
    } else {
      tooltip.classList.remove('visible');
    }
  });

// Load local land topology and convert TopoJSON → GeoJSON
fetch('ne_110m_land.json')
  .then(r => r.json())
  .then(topo => {
    const land = topojson.feature(topo, topo.objects.land);
    globe
      .polygonsData(land.features)
      .polygonCapColor(() => '#ebebeb')
      .polygonSideColor(() => '#d8d8d8')
      .polygonStrokeColor(() => '#cccccc')
      .polygonAltitude(0.003);
  })
  .catch(() => { /* globe still visible without land polygons */ });

globe.controls().autoRotate      = true;
globe.controls().autoRotateSpeed = 0.6;
globe.controls().enableDamping   = true;
globe.pointOfView({ lat: 30, lng: -15, altitude: 2.2 }, 0);

window.addEventListener('resize', () => {
  globe.width(container.clientWidth).height(container.clientHeight);
});

container.addEventListener('mousemove', e => {
  tooltip.style.left = (e.clientX + 14) + 'px';
  tooltip.style.top  = (e.clientY - 10) + 'px';
});

</script>
</body>
</html>
